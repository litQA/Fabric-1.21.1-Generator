global_templates:
  - template: elementinits/item_extensions.java.ftl
    writer: java
    condition_any:
      - "${w.getGElementsOfType('itemextension')?filter(e -> e.enableFuel)?size != 0}"
      - "${w.getGElementsOfType('itemextension')?filter(e -> e.compostLayerChance gt 0)?size != 0}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameItemExtensions.java"
  - template: elementinits/dispensebehaviors.java.ftl
    writer: java
    condition_any:
      - "${w.getGElementsOfType('itemextension')?filter(e -> e.hasDispenseBehavior)?size != 0}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameDispenseBehaviors.java"

localizationkeys:
  - key: item.@modid.@registryname
    mapto: name
